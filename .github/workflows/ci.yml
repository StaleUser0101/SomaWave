name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MPV and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mpv ffmpeg
      - name: Build and install wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m zipfile -t dist/*.whl
          python -m pip install dist/*.whl
          python -m pip check
          python -I -c 'from somawave.settings import app_version; assert app_version() != "development"'
      - name: Test locally without the live SomaFM service
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/build-release.sh
