name: Bug report
description: Report a reproducible problem with SomaWave
body:
  - type: markdown
    attributes:
      value: For security issues, follow SECURITY.md. Remove personal information from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: SomaWave version
      description: Shown at the bottom of Settings.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, terminal, Python and MPV versions, and whether you use Omarchy.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
